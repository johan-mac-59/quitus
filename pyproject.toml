[project]
name = "projet-nettoyage-auto"
version = "1.1.0"
description = "Pipeline interactif de profilage et de nettoyage automatique de fichiers CSV, Excel et JSON, en ligne de commande et via une interface web Streamlit."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pandas",
    "numpy",
    "tabulate>=0.10.0",
    "seaborn>=0.13.2",
    "openpyxl>=3.1.5",
    "streamlit>=1.64.0",
    "matplotlib>=3.11.1",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]

