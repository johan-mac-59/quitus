# Configuration Streamlit — CE FICHIER DOIT ÊTRE VERSIONNÉ.
# Le réglage gatherUsageStats ci-dessous est une mesure de conformité, pas une
# préférence locale : c'est lui qui supprime le seul traceur non essentiel de
# l'application. Voir la section « Confidentialité » du README.

[browser]
# Désactive la télémétrie Streamlit (Segment). Sans ce réglage, l'application
# déposerait un cookie de mesure d'audience, qui exigerait alors une bannière
# de consentement. Avec, il ne reste que le cookie technique XSRF, exempt.
gatherUsageStats = false

[server]
# Taille maximale d'un fichier déposé, en Mo. Volontairement basse : un fichier
# coûte environ dix fois sa taille en mémoire pendant le traitement (mesuré à
# l'Étape 43), et une app gratuite sur Streamlit Community Cloud en a peu.
maxUploadSize = 20

# Aucun thème imposé : l'application suit le réglage du système du visiteur, et
# chacun peut choisir clair, sombre ou automatique dans le menu Settings. Fixer
# [theme] base supprimerait ce choix.
